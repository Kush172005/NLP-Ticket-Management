s:minmax(150px,1.1fr) minmax(100px,2fr) 55px;align-items:center;gap:10px;font-size:10px}.hbar-label{color:#b6c4d1}.hbar-fill{height:10px;border-radius:99px;background:linear-gradient(90deg,#4685bd,#66d4c9)}.hbar-value{text-align:right;color:#dbe8f2;font-variant-numeric:tabular-nums}.result-badge{display:inline-flex;border:1px solid #32645d;border-radius:99px;padding:4px 8px;color:#a4e8d9;background:#142824;font-size:9px;font-weight:700}.table-note{color:#8596a8;font-size:10px;margin-top:9px}.decision-banner{padding:12px 14px;border-radius:11px;border:1px solid #55482a;background:#29251b;color:#ecd69d;font-size:11px;line-height:1.6}.model-flow{display:grid;grid-template-columns:repeat(7,minmax(90px,1fr));gap:8px;align-items:stretch;margin:18px 0}.flow-card{padding:13px 10px;border:1px solid #2b3d48;background:#121d27;border-radius:11px;min-height:88px;position:relative}.flow-card b{display:block;color:#9be4d7;font-size:10px;margin-bottom:5px}.flow-card span{display:block;color:#a1b1c0;font-size:9px;line-height:1.5}.flow-arrow{position:absolute;right:-10px;top:50%;z-index:2;transform:translateY(-50%);color:#80aaa8;background:#121d27;border-radius:50%;padding:0 3px}.endpoint-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.endpoint-card{padding:12px;border:1px solid #2a3846;border-radius:10px;background:#101923}.endpoint-card code{color:#8fe1d7;font-size:10px}.endpoint-card p{font-size:10px;color:#9daebe;margin:5px 0 0}.mini-timeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:20px 0}.milestone-mini{padding:14px;border:1px solid #2c3a48;border-radius:13px;background:#111923;cursor:pointer;text-align:left;transition:transform .15s,border-color .15s}.milestone-mini:hover{transform:translateY(-2px);border-color:#4a938e}.milestone-mini b{display:block;color:#8de0d4;font-size:10px;letter-spacing:.07em}.milestone-mini strong{display:block;font-size:11px;margin:5px 0}.milestone-mini span{font-size:9px;color:#91a0b1}.metric-explain{font-size:10px;color:#8495a7;line-height:1.6;margin-top:8px}.risk-list{display:grid;gap:8px}.risk-row{display:grid;grid-template-columns:1fr auto;gap:10px;border-bottom:1px solid #26323f;padding:9px 0;font-size:10px}.risk-row:last-child{border:0}.risk-row span{color:#aab9c8}.risk-row b{color:#dfeaf3;text-align:right}.warning-note{padding:11px 13px;border:1px solid #51462d;background:#29251c;border-radius:10px;color:#ddc98e;font-size:10px;line-height:1.6;margin-top:12px}
    @media(max-width:900px){.mini-timeline{grid-template-columns:repeat(3,minmax(0,1fr))}.model-flow{grid-template-columns:repeat(4,minmax(90px,1fr))}.flow-arrow{display:none}}
    @media(max-width:600px){.journey-grid,.info-grid,.endpoint-grid{grid-template-columns:1fr}.metric-strip{grid-template-columns:repeat(2,minmax(0,1fr))}.mini-timeline{grid-template-columns:repeat(2,minmax(0,1fr))}.model-flow{grid-template-columns:repeat(2,minmax(0,1fr))}.hbar-row{grid-template-columns:115px minmax(50px,1fr) 45px}.split-row{grid-template-columns:60px 1fr 70px}.milestone-tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.milestone-tab{padding:7px 4px;font-size:10px}.milestone-tab small{font-size:7px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H12l-4.5 3v-3H6.5A2.5 2.5 0 0 1 4 14.5z"/><path d="M8 9h8M8 12h5"/></svg></div><div><div class="brand-name">Ticket Management System</div><div class="brand-sub">Customer Support Intelligence</div></div></div>
      <div class="nav-label">WORKSPACE</div>
      <nav class="nav" aria-label="Main navigation">
        <button class="active" data-page="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg>Dashboard</button>
        <button data-page="journey"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 18h4l3-5 3 2 5-8"/><circle cx="4" cy="18" r="1.5"/><circle cx="19" cy="7" r="1.5"/></svg>Project Journey</button>
        <button data-page="intelligence"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3 5 6v5c0 4.5 2.8 8 7 10 4.2-2 7-5.5 7-10V6z"/><path d="m9 12 2 2 4-4"/></svg>Ticket Intelligence</button>
        <button data-page="tickets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h14a2 2 0 0 1 2 2v3a3 3 0 0 0 0 6v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a3 3 0 0 0 0-6V6a2 2 0 0 1 2-2Z"/><path d="M13 7v2m0 3v2m0 3v1"/></svg>Tickets</button>
        <button data-page="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3 5 6v5c0 4.5 2.8 8 7 10 4.2-2 7-5.5 7-10V6z"/><path d="m9 12 2 2 4-4"/></svg>Review Queue</button>
        <button data-page="analytics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V5m0 14h17"/><path d="m7 15 4-4 3 2 6-7"/></svg>Analytics</button>
        <button data-page="evaluation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V5m0 14h16"/><path d="M8 16V9m4 7V5m4 11v-4"/></svg>Model Evaluation</button>
        <button data-page="architecture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="8" y="3" width="8" height="5" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/><rect x="14" y="16" width="7" height="5" rx="1.5"/><path d="M12 8v4M6.5 16v-2h11v2"/></svg>Architecture</button>
        <button data-page="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3m-4 4v3"/></svg>Privacy</button>
      </nav>
      <div class="side-bottom"><div class="api-card"><div class="api-card-head"><span class="dot" id="apiDot"></span><span id="apiState">Checking API…</span></div><p id="apiAddress">Local service · 127.0.0.1:8000</p></div><div class="side-note">Suggestions are categories for agent review. No customer reply is generated.</div></div>
    </aside>
    <div class="mobile-scrim" id="mobileScrim"></div>
    <main class="main">
      <header class="topbar"><button class="icon-button mobile-menu" id="menuButton" aria-label="Open navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="crumb"><span>Workspace</span><span>›</span><strong id="breadcrumb">Dashboard</strong></div><div class="top-actions"><span class="classification-badge"><span class="class-icon">◎</span>Classification only</span><span class="local-badge">Local demo</span><button class="icon-button" id="refreshButton" title="Refresh API metrics" aria-label="Refresh metrics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 11a8 8 0 0 0-14-5L4 8"/><path d="M4 4v4h4M4 13a8 8 0 0 0 14 5l2-2M20 20v-4h-4"/></svg></button></div></header>
      <div class="content" id="content"></div>
    </main>
  </div>
  <div class="drawer-scrim" id="drawerScrim"></div><aside class="drawer" id="drawer" aria-label="Ticket details"></aside><div class="toast" id="toast" role="status"></div>
  <script>
    const MAX_CHARS = 4000;
    const EXAMPLES = [
      ["Card payment pending", "My card payment is pending"],
      ["Freeze a lost card", "I lost my card and need to freeze it"],
      ["Card delivery issue", "My new card has not arrived yet"],
      ["Payment not recognised", "I do not recognize a payment on my account"],
      ["Charged twice", "I was charged twice for my card payment"],
      ["Refund issue", "When will I get my refund?"]
    ];
    const PAGE_TITLES = {dashboard:"Dashboard", journey:"Project Journey", intelligence:"Ticket Intelligence", tickets:"Tickets", review:"Review Queue", analytics:"Analytics", evaluation:"Model Evaluation", architecture:"Architecture", privacy:"Privacy"};
    const requestedPage = new URLSearchParams(location.search).get("view");
    let currentPage = Object.hasOwn(PAGE_TITLES, requestedPage) && requestedPage !== "review" ? requestedPage : "dashboard";
    let apiMetrics = null;
    let apiReady = false;
    let persistedReviewCount = null;
    let persistedTickets = [];
    let projectIntents = [];
    let supportDepartments = [];
    let operationsSummary = null;
    let departmentCounts = [];
    let requestedDepartmentFilter = "";
    let pendingText = "";
    let lastError = "";
    let toastTimer;
    const $ = (selector, root=document) => root.querySelector(selector);
    const historyStore = {
      read(){try{return JSON.parse(sessionStorage.getItem("ticket-intelligence-history") || "[]")}catch(_){return []}},
      write(items){try{sessionStorage.setItem("ticket-intelligence-history", JSON.stringify(items.slice(0,100)))}catch(_){showToast("Browser session storage is unavailable; this history will not persist.")}}
    };
    let historyItems = historyStore.read();

    function esc(value){return String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]))}
    function humanize(value){return String(value || "").replace(/_/g," ").replace(/\s+/g," ").trim().replace(/\b\w/g, c=>c.toUpperCase())}
    function fmt(value){return new Intl.NumberFormat().format(Number(value)||0)}
    function formatDate(value){const date=new Date(value);return Number.isNaN(date.getTime())?"—":date.toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}
    function showToast(message){const node=$("#toast");node.textContent=message;node.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove("show"),2600)}
    function statusPill(item){return item.reviewRequired?'<span class="status-pill review"><i class="tiny-dot"></i>Review required</span>':'<span class="status-pill checked"><i class="tiny-dot"></i>No review flag</span>'}
    function tableRows(items, limit=100){
      if(!items.length)return '<tr><td colspan="5"><div class="empty-row">No ticket predictions in this browser session yet.<br>Analyze a sample ticket to see it here.</div></td></tr>';
      return items.slice(0,limit).map(item=>`<tr data-ticket="${esc(item.requestId)}"><td class="mono">${esc(item.requestId)}</td><td class="message-cell" title="${esc(item.text)}">${esc(item.text)}</td><td class="intent-label">${esc(humanize(item.suggestion))}</td><td>${statusPill(item)}</td><td>${esc(formatDate(item.createdAt))}</td></tr>`).join("");
    }
    function pageHeading(eyebrow,title,description,actions=""){
      return `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${description}</p></div>${actions?`<div class="heading-actions">${actions}</div>`:""}</div>`;
    }
    function metricCard(label,value,foot,icon){return `<article class="card metric-card"><div class="metric-top"><span>${label}</span><span class="metric-icon">${icon}</span></div><div class="metric-value">${value}</div><div class="metric-foot">${foot}</div></article>`}
    const icons={tickets:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h14a2 2 0 0 1 2 2v3a3 3 0 0 0 0 6v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a3 3 0 0 0 0-6V6a2 2 0 0 1 2-2Z"/></svg>',review:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3 4.5 6v5.5c0 4.4 3 7.5 7.5 9.5 4.5-2 7.5-5.1 7.5-9.5V6z"/><path d="M12 8v5m0 3h.01"/></svg>',requests:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V5m0 14h16"/><path d="M8 15v-4m4 4V7m4 8v-6"/></svg>',latency:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'};

    function dashboardPage(){
      const successful=apiMetrics?.successful_predictions;
      const requests=apiMetrics?.prediction_requests;
      const average=apiMetrics?.average_latency_ms;
      const ops=operationsSummary;
      const metricValues={analyzed:successful==null?"—":fmt(successful),review:persistedReviewCount==null?"—":fmt(persistedReviewCount),requests:requests==null?"—":fmt(requests),latency:average==null?"—":`${Number(average).toFixed(2)} ms`};
      return pageHeading("SUPPORT OPERATIONS","Customer Support Intelligence","Understand, classify and review customer tickets with AI-assisted triage.",'<button class="primary-button" data-go="intelligence"><span class="spark">✦</span>Analyze a ticket</button>')+
        `<div class="notice"><span class="notice-icon">◎</span><div><strong>Classification only</strong>This system suggests a support category. It does not answer customer questions or decide the final ticket action.</div></div>
        <section class="grid metric-grid">${metricCard("Tickets analyzed",metricValues.analyzed,"Successful predictions · API metrics",icons.tickets)}${metricCard("Awaiting review",metricValues.review,"Persisted tickets · local API",icons.review)}${metricCard("Prediction requests",metricValues.requests,"All requests · API metrics",icons.requests)}${metricCard("Average latency",metricValues.latency,"Average · API metrics",icons.latency)}</section>
        <div class="recent-layout"><section class="card section-card"><div class="section-head"><div><h2>Recent predictions</h2><p>Current browser session · persisted tickets are available in the Review Queue</p></div><button class="text-link" data-go="review">Open Review Queue →</button></div><div class="table-wrap"><table><thead><tr><th>Request ID</th><th>Customer message</th><th>Suggested intent</th><th>Review</th><th>Time</th></tr></thead><tbody>${tableRows(historyItems,5)}</tbody></table></div></section>
        <section class="card section-card"><div class="section-head"><div><h2>Service status</h2><p>Live information from your local API</p></div><span class="dot ${apiReady?"online":"offline"}"></span></div><div class="api-summary"><div class="summary-row"><span>Prediction API</span><b>${apiReady?"Ready":"Unavailable"}</b></div><div class="summary-row"><span>Model loaded</span><b>${apiMetrics?.model_ready?"Yes":apiMetrics?"No":"—"}</b></div><div class="summary-divider"></div><div class="summary-row"><span>Successful predictions</span><b>${successful==null?"—":fmt(successful)}</b></div><div class="summary-row"><span>Client errors</span><b>${apiMetrics?.client_errors==null?"—":fmt(apiMetrics.client_errors)}</b></div><div class="summary-row"><span>Server errors</span><b>${apiMetrics?.server_errors==null?"—":fmt(apiMetrics.server_errors)}</b></div><button class="text-link" style="text-align:left;padding:8px 0 0" id="refreshMetrics">Refresh service data ↻</button></div></section></div>
        <section class="grid metric-grid" style="margin-top:17px">${metricCard("Total tickets",ops?.total_tickets==null?"—":fmt(ops.total_tickets),"Persisted in local database",icons.tickets)}${metricCard("Human verified",ops?.human_verified==null?"—":fmt(ops.human_verified),"Approved AI classifications",icons.review)}${metricCard("Human corrected",ops?.human_corrected==null?"—":fmt(ops.human_corrected),"Corrected by reviewer",icons.review)}${metricCard("Routed",ops?.routed==null?"—":fmt(ops.routed),"Waiting for agent assignment",icons.tickets)}${metricCard("In progress",ops?.in_progress==null?"—":fmt(ops.in_progress),"Assigned agent work started",icons.tickets)}${metricCard("Resolved",ops?.resolved==null?"—":fmt(ops.resolved),"Resolution summary saved",icons.tickets)}</section>
        <section class="card section-card" style="margin-top:15px"><div class="section-head"><div><h2>Tickets by Department</h2><p>Counts use saved routing decisions only.</p></div><button class="text-link" data-go="tickets">View ticket list →</button></div><div class="dept-dashboard">${departmentCounts.length?departmentCounts.map(item=>`<button class="dept-dashboard-card" data-dept-filter="${esc(item.department)}"><b>${fmt(item.count)}</b><span>${esc(item.department)}</span></button>`).join(""):'<div class="empty-row">No department totals are available yet.</div>'}</div></section>`;
    }
    function intelligencePage(){
      const examples=EXAMPLES.map(([label,text])=>`<button class="example-chip" data-example="${esc(text)}">${esc(label)}</button>`).join("");
      const result=window.lastPrediction?renderPrediction(window.lastPrediction):'';
      const error=lastError?`<div class="error-box"><strong>Unable to analyze ticket</strong><br>${esc(lastError)}<br><button id="retryButton">Retry</button></div>`:"";
      return pageHeading("TICKET INTELLIGENCE","Analyze a customer ticket","Get an AI-assisted intent category for a support agent to review.")+
        `<div class="notice" style="margin-bottom:16px"><span class="notice-icon">◎</span><div><strong>This system classifies tickets. It does not answer customer questions.</strong>Predictions are suggestions for a human support agent to verify.</div></div>
        <div class="ticket-layout"><section class="card form-card"><h2 class="card-title">Customer message</h2><p class="card-description">Paste a support ticket or try one of the sample messages.</p><div class="textarea-wrap"><textarea class="ticket-input" id="ticketInput" maxlength="${MAX_CHARS}" placeholder="Describe the customer's issue..." aria-label="Customer ticket message">${esc(pendingText)}</textarea><span class="char-count" id="charCount">${pendingText.length} / ${MAX_CHARS}</span></div><div class="form-row"><span class="field-note">Avoid entering real sensitive customer information.</span><button class="primary-button" id="predictButton" ${apiReady?"":"disabled"}><span class="spark">✦</span>Suggest Intent</button></div><div class="eyebrow" style="color:#8295a8;letter-spacing:.1em;margin:0 0 8px">TRY AN EXAMPLE</div><div class="examples">${examples}</div>${error}</section>
        <section class="card result-card"><div class="section-head"><div><h2 class="card-title">AI classification</h2><p class="card-description" style="margin:4px 0 0">Intent suggestions from your existing model</p></div><span class="classification-badge">Category only</span></div><div class="empty-state" id="emptyResult" style="${result?"display:none":""}"><div><div class="empty-art"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 5 6v5c0 4.5 2.8 8 7 10 4.2-2 7-5.5 7-10V6z"/><path d="M9 12h6m-3-3v6"/></svg></div><h3>No ticket analyzed yet</h3><p>Enter a customer message to see the predicted support intent.</p></div></div><div class="result-content ${result?"visible":""}" id="resultContent">${result}</div><div class="loader" id="loadingState" style="display:none"><span class="spinner"></span><div><b>Analyzing ticket…</b><div class="load-note">Visual progress only; the API does not report individual processing stages.</div></div></div></section></div>`;
    }
    function renderPrediction(item){
      const alternatives=(item.alternatives||[]).length?(item.alternatives||[]).map((label,index)=>`<div class="alt-item"><span class="alt-number">${index+1}</span><span class="alt-name">${esc(humanize(label))}</span></div>`).join(""):'<div class="subtle" style="font-size:11px">No alternative categories were returned.</div>';
      const review=item.reviewRequired?'<div class="review-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3 4.5 6v5.5c0 4.4 3 7.5 7.5 9.5 4.5-2 7.5-5.1 7.5-9.5V6z"/><path d="M12 8v5m0 3h.01"/></svg><div><strong>Human Review Required</strong><p>The model has suggested a category. A support agent should verify the classification before finalizing the ticket.</p></div></div>':'<div class="review-box safe"><div><strong>Review flag not set</strong><p>Still treat the category as an AI suggestion and follow your normal review process.</p></div></div>';
      return `<div class="result-kicker">Suggested intent</div><div class="suggestion-box"><div class="suggestion-human">${esc(humanize(item.suggestion))}</div><div class="suggestion-raw">${esc(item.suggestion)}</div></div><div class="result-kicker">Alternative categories</div><div class="alt-list">${alternatives}</div>${review}<div class="api-detail"><div><span>API</span><b>POST /predict · HTTP ${esc(item.httpStatus)}</b></div><div><span>Client round-trip</span><b>${Number(item.latencyMs).toFixed(1)} ms</b></div><div><span>Request ID</span><b class="mono">${esc(item.requestId)}</b></div><div><span>Persisted ticket</span><b>${item.ticketId?`<a href="/admin/review?ticket=${encodeURIComponent(item.ticketId)}" style="color:#9ce5dc">${esc(item.ticketId)} · Open review →</a>`:"Not returned by API"}</b></div></div><details class="pipeline"><summary>How was this ticket processed?</summary><div class="pipeline-content"><div class="pipeline-list"><div class="pipeline-step"><b>1 · Input validation</b>Non-empty text; up to 4,000 characters.</div><div class="pipeline-step"><b>2 · Text cleaning</b>Pattern-based masking and text normalization.</div><div class="pipeline-step"><b>3 · Feature extraction</b>Saved word and character TF-IDF features.</div><div class="pipeline-step"><b>4 · Classification</b>Linear SVM ranks intent categories.</div><div class="pipeline-step"><b>5 · Intent ranking</b>Top suggestion plus alternatives; no confidence score.</div><div class="pipeline-step"><b>6 · Human review</b>Agent checks the suggested category.</div></div><p class="pipeline-note">This describes the implemented pipeline. The API returns category labels, not an explanation of why a particular label was selected.</p></div></details>`;
    }
    function ticketsPage(){
      return pageHeading("SUPPORT OPERATIONS","Tickets","Search and track persisted tickets across review, routing, agent work and resolution.",'<button class="text-link" data-go="review">Open review queue →</button>')+
        `<section class="card section-card"><div class="notice"><span class="notice-icon">ⓘ</span><div><strong>Persistent ticket records</strong>These records are stored in the local SQLite database. The assigned department, agent and lifecycle status update as actions are recorded.</div></div><div class="filters"><input class="filter-control search-control" id="serverTicketSearch" type="search" placeholder="Search ID, customer message, intent…" aria-label="Search tickets"><select class="filter-control" id="serverDepartmentFilter"><option value="">All departments</option></select><select class="filter-control" id="serverStatusFilter"><option value="">All statuses</option>${["AWAITING_REVIEW","ROUTED","IN_PROGRESS","RESOLVED"].map(status=>`<option>${status}</option>`).join("")}</select><select class="filter-control" id="serverAiFilter"><option value="">All AI intents</option></select><select class="filter-control" id="serverFinalFilter"><option value="">All final intents</option></select><select class="filter-control" id="serverDecisionFilter"><option value="">All review decisions</option><option value="HUMAN_VERIFIED">Human Verified</option><option value="HUMAN_CORRECTED">Human Corrected</option></select><input class="filter-control" id="serverDateFilter" type="date" aria-label="Filter by creation date"></div><div class="history-meta" id="serverTicketMeta">Loading persisted tickets…</div><div class="table-wrap history-table"><table><thead><tr><th>Ticket ID</th><th>Customer Message</th><th>AI Intent</th><th>Final Intent</th><th>Department</th><th>Assigned Agent</th><th>Status</th><th>Created At</th></tr></thead><tbody id="serverTicketRows"><tr><td colspan="8"><div class="empty-row">Loading ticket records…</div></td></tr></tbody></table></div></section>`;
    }
    function placeholderPage(page){
      const anchors={journey:"",analytics:"#M2",evaluation:"#M3",architecture:"#M5",privacy:"#privacy"};
      const descriptions={journey:"Explore every milestone from M1 through M5.",analytics:"See the actual Banking77 dataset profile and preparation results from M2.",evaluation:"Compare M3 models and review M4 optimization, errors and robustness.",architecture:"Explore the deployed M5 architecture, API behavior and measured benchmark.",privacy:"Review M2 data handling and M5 application privacy limits."};
      return pageHeading("PROJECT EVIDENCE",PAGE_TITLES[page],descriptions[page])+`<iframe title="${PAGE_TITLES[page]} · M1–M5 project evidence" src="/project_journey.html${anchors[page]}" style="width:100%;height:calc(100vh - 165px);min-height:720px;border:1px solid #263342;border-radius:14px;background:#0b1017"></iframe>`;
    }
    function analyticsPage(){return pageHeading("OPERATIONS ANALYTICS","Ticket Analytics","Human review feedback and ticket lifecycle counts from locally saved decisions.")+`<div id="analyticsContent"><section class="card section-card"><div class="empty-row">Loading saved ticket analytics…</div></section></div>`}
    function render(){
      $("#breadcrumb").textContent=PAGE_TITLES[currentPage];
      document.querySelectorAll(".nav button").forEach(button=>button.classList.toggle("active",button.dataset.page===currentPage));
      const pages={dashboard:dashboardPage,intelligence:intelligencePage,tickets:ticketsPage,analytics:analyticsPage};
      $("#content").innerHTML=pages[currentPage]?pages[currentPage]():placeholderPage(currentPage);
      bindPageActions();
      $("#sidebar").classList.remove("open");$("#mobileScrim").classList.remove("open");
      window.scrollTo({top:0,behavior:"smooth"});
    }
    function bindPageActions(){
      document.querySelectorAll("[data-go]").forEach(button=>button.addEventListener("click",()=>navigate(button.dataset.go)));
      if(currentPage==="intelligence"){
        const input=$("#ticketInput");input.addEventListener("input",()=>{pendingText=input.value;$("#charCount").textContent=`${input.value.length} / ${MAX_CHARS}`;lastError=""});
        document.querySelectorAll("[data-example]").forEach(button=>button.addEventListener("click",()=>{pendingText=button.dataset.example;render();const target=$("#ticketInput");target.focus();target.setSelectionRange(target.value.length,target.value.length)}));
        $("#predictButton").addEventListener("click",submitPrediction);
        $("#retryButton")?.addEventListener("click",submitPrediction);
      }
      if(currentPage==="tickets"){
        ["serverTicketSearch","serverDepartmentFilter","serverStatusFilter","serverAiFilter","serverFinalFilter","serverDecisionFilter","serverDateFilter"].forEach(id=>$("#"+id).addEventListener(id==="serverTicketSearch"?"input":"change",filterPersistentTickets));
        loadPersistentTickets();
      }
      if(currentPage==="analytics")loadOperationalAnalytics();
      if(currentPage==="dashboard"){$("#refreshMetrics")?.addEventListener("click",loadMetrics);document.querySelectorAll("[data-dept-filter]").forEach(button=>button.addEventListener("click",()=>{requestedDepartmentFilter=button.dataset.deptFilter;navigate("tickets")}))}
    }
    function navigate(page){if(page==="review"){location.href="/admin/review";return}currentPage=page;history.replaceState(null,"",`/?view=${encodeURIComponent(page)}`);render()}
    function bindTicketRows(){document.querySelectorAll("tr[data-ticket]").forEach(row=>row.addEventListener("click",()=>openDrawer(row.dataset.ticket)))}
    async function loadPersistentTickets(){
      const meta=$("#serverTicketMeta");
      try{
        const [ticketsResponse,labelsResponse,departmentsResponse]=await Promise.all([fetch("/tickets",{cache:"no-store"}),fetch("/tickets/labels",{cache:"no-store"}),fetch("/departments",{cache:"no-store"})]);
        if(!ticketsResponse.ok||!labelsResponse.ok||!departmentsResponse.ok)throw new Error("Unable to load ticket data.");
        persistedTickets=(await ticketsResponse.json()).tickets||[];projectIntents=(await labelsResponse.json()).labels||[];supportDepartments=(await departmentsResponse.json()).departments||[];
        $("#serverDepartmentFilter").innerHTML='<option value="">All departments</option>'+supportDepartments.map(item=>`<option value="${esc(item.name)}">${esc(item.name)}</option>`).join("");
        if(requestedDepartmentFilter){$("#serverDepartmentFilter").value=requestedDepartmentFilter;requestedDepartmentFilter="";}
        const intentOptions=projectIntents.map(label=>`<option value="${esc(label)}">${esc(humanize(label))}</option>`).join("");
        $("#serverAiFilter").innerHTML='<option value="">All AI intents</option>'+intentOptions;
        $("#serverFinalFilter").innerHTML='<option value="">All final intents</option>'+intentOptions;
        renderPersistentTickets();
      }catch(error){meta.textContent="Unable to load tickets. Check that the local service is running, then refresh.";$("#serverTicketRows").innerHTML='<tr><td colspan="8"><div class="empty-row">Ticket data could not be loaded.</div></td></tr>';}
    }
    function renderPersistentTickets(){
      const query=$("#serverTicketSearch").value.trim().toLowerCase(),department=$("#serverDepartmentFilter").value,status=$("#serverStatusFilter").value,ai=$("#serverAiFilter").value,finalIntent=$("#serverFinalFilter").value,decision=$("#serverDecisionFilter").value,date=$("#serverDateFilter").value;
      const filtered=persistedTickets.filter(item=>{const haystack=[item.ticket_id,item.request_id,item.message,item.ai_intent,item.final_intent,item.assigned_department,item.assigned_agent].join(" ").toLowerCase();const day=String(item.created_at||"").slice(0,10);return(!query||haystack.includes(query))&&(!department||item.assigned_department===department)&&(!status||item.status===status)&&(!ai||item.ai_intent===ai)&&(!finalIntent||item.final_intent===finalIntent)&&(!decision||item.review_outcome===decision)&&(!date||day===date)});
      $("#serverTicketMeta").textContent=`${filtered.length} matching · ${persistedTickets.length} saved ticket${persistedTickets.length===1?"":"s"}`;
      $("#serverTicketRows").innerHTML=filtered.length?filtered.map(item=>`<tr data-stored-ticket="${esc(item.ticket_id)}"><td class="mono">${esc(item.ticket_id)}</td><td class="message-cell" title="${esc(item.message)}">${esc(item.message)}</td><td class="intent-label" title="${esc(item.ai_intent)}">${esc(humanize(item.ai_intent))}</td><td>${esc(item.final_intent?humanize(item.final_intent):"—")}</td><td>${esc(item.assigned_department||"—")}</td><td>${esc(item.assigned_agent||"—")}</td><td>${esc(item.status)}</td><td>${esc(formatDate(item.created_at))}</td></tr>`).join(""):persistedTickets.length?'<tr><td colspan="8"><div class="empty-row">No tickets match these filters.</div></td></tr>':'<tr><td colspan="8"><div class="empty-row">No tickets yet. Submit a sample message from Ticket Intelligence to create one.</div></td></tr>';
      document.querySelectorAll("[data-stored-ticket]").forEach(row=>row.addEventListener("click",()=>{location.href=`/admin/review?ticket=${encodeURIComponent(row.dataset.storedTicket)}`}));
    }
    function filterPersistentTickets(){renderPersistentTickets()}
    async function loadOperationalAnalytics(){
      try{
        const [feedbackResponse,operationsResponse,ticketsResponse]=await Promise.all([fetch("/tickets/feedback",{cache:"no-store"}),fetch("/tickets/operations",{cache:"no-store"}),fetch("/tickets",{cache:"no-store"})]);
        if(!feedbackResponse.ok||!operationsResponse.ok||!ticketsResponse.ok)throw new Error("Analytics could not be loaded.");
        const feedback=await feedbackResponse.json(),operations=await operationsResponse.json(),tickets=(await ticketsResponse.json()).tickets||[];
        const corrected={};tickets.filter(ticket=>ticket.review_outcome==="HUMAN_CORRECTED").forEach(ticket=>{corrected[ticket.ai_intent]=(corrected[ticket.ai_intent]||0)+1});
        const topCorrected=Object.entries(corrected).sort((a,b)=>b[1]-a[1]).slice(0,8);
        const statuses=["AWAITING_REVIEW","ROUTED","IN_PROGRESS","RESOLVED"].map(status=>[status,tickets.filter(ticket=>ticket.status===status).length]);
        const depts=operations.departments||[];
        $("#analyticsContent").innerHTML=`<section class="grid metric-grid">${metricCard("Reviewed Tickets",fmt(feedback.reviewed_total||0),"Persisted human decisions",icons.review)}${metricCard("AI / Human Agreement",feedback.agreement_rate==null?"—":`${(feedback.agreement_rate*100).toFixed(1)}%`,"AI intent equals final intent",icons.tickets)}${metricCard("Human Correction Rate",feedback.correction_rate==null?"—":`${(feedback.correction_rate*100).toFixed(1)}%`,"Corrected ÷ reviewed",icons.review)}${metricCard("Resolution Volume",fmt(operations.summary?.resolved||0),"Tickets with resolution summaries",icons.tickets)}</section><div class="recent-layout"><section class="card section-card"><div class="section-head"><div><h2>Tickets by Department</h2><p>Only routed tickets are included.</p></div></div><div class="analytics-list">${depts.map(item=>`<button class="analytics-row" data-analytics-department="${esc(item.department)}"><span>${esc(item.department)}</span><b>${item.count}</b></button>`).join("")||'<div class="empty-row">No routed tickets yet.</div>'}</div></section><section class="card section-card"><div class="section-head"><div><h2>Tickets by Status</h2><p>Current saved lifecycle stage.</p></div></div><div class="analytics-list">${statuses.map(([status,count])=>`<div class="analytics-row"><span>${status}</span><b>${count}</b></div>`).join("")}</div></section></div><section class="card section-card" style="margin-top:15px"><div class="section-head"><div><h2>Most corrected AI intents</h2><p>Frequency in saved human corrections. No automatic retraining is performed.</p></div></div><div class="analytics-list">${topCorrected.map(([intent,count])=>`<div class="analytics-row"><span>${esc(humanize(intent))} <small class="mono">${esc(intent)}</small></span><b>${count}</b></div>`).join("")||'<div class="empty-row">No human corrections recorded yet.</div>'}</div></section>`;
        document.querySelectorAll("[data-analytics-department]").forEach(button=>button.addEventListener("click",()=>{requestedDepartmentFilter=button.dataset.analyticsDepartment;navigate("tickets")}));
      }catch(_){$("#analyticsContent").innerHTML='<section class="card section-card"><div class="empty-row">Unable to load saved ticket analytics. Check the local service and retry.</div></section>'}
    }
    function openDrawer(requestId){
      const item=historyItems.find(row=>row.requestId===requestId);if(!item)return;
      $("#drawer").innerHTML=`<div class="drawer-head"><div><div class="eyebrow">SESSION TICKET</div><h2>Prediction details</h2></div><button class="icon-button" id="closeDrawer" aria-label="Close details">×</button></div><div class="drawer-section"><h3>Customer message</h3><div class="drawer-message">${esc(item.text)}</div></div><div class="drawer-section"><h3>AI prediction · category only</h3><div class="drawer-raw">${esc(item.suggestion)}</div><div class="subtle" style="font-size:11px;margin-top:4px">${esc(humanize(item.suggestion))}</div></div><div class="drawer-section"><h3>Alternative categories</h3><div class="drawer-alts">${(item.alternatives||[]).map(label=>`<div>${esc(humanize(label))} <span class="mono">(${esc(label)})</span></div>`).join("")||'<div class="subtle">None returned</div>'}</div></div><div class="drawer-section"><h3>Review required</h3>${statusPill(item)}<p class="subtle" style="font-size:10px">${item.reviewRequired?"Agent should verify this suggested category.":"The API did not flag this prediction for review."}</p></div><div class="drawer-section"><h3>API information</h3><div class="drawer-meta"><div><span>Request ID</span><b class="mono">${esc(item.requestId)}</b></div><div><span>HTTP status</span><b>${esc(item.httpStatus)}</b></div><div><span>Client round-trip</span><b>${Number(item.latencyMs).toFixed(1)} ms</b></div><div><span>Time (local)</span><b>${esc(formatDate(item.createdAt))}</b></div></div></div><div class="drawer-section"><span class="local-badge">Local browser session</span></div>`;
      $("#drawer").classList.add("open");$("#drawerScrim").classList.add("open");$("#closeDrawer").addEventListener("click",closeDrawer);
    }
    function closeDrawer(){$("#drawer").classList.remove("open");$("#drawerScrim").classList.remove("open")}
    async function submitPrediction(){
      const text=$("#ticketInput")?.value??pendingText;pendingText=text;lastError="";
      if(!text.trim()){lastError="Enter a customer message before requesting a suggestion.";render();return}
      if(text.length>MAX_CHARS){lastError=`Messages must be ${MAX_CHARS} characters or fewer.`;render();return}
      const button=$("#predictButton");if(button)button.disabled=true;
      $("#errorPlaceholder")?.remove();
      $("#emptyResult").style.display="none";$("#resultContent").classList.remove("visible");$("#loadingState").style.display="flex";
      const started=performance.now();
      try{
        const response=await fetch("/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});
        const elapsed=performance.now()-started;
        let payload={};try{payload=await response.json()}catch(_){payload={}}
        if(!response.ok){
          const messages={400:"The message is empty or has no usable words. Edit it and try again.",413:"This message is too long for the API. Keep it within 4,000 characters.",415:"The API did not accept this request format.",503:"The model is not ready. Check that the API server has loaded the model."};
          throw new Error(messages[response.status]||`The API returned HTTP ${response.status}. Please retry.`);
        }
        const item={requestId:payload.request_id,ticketId:payload.ticket_id,suggestion:payload.suggestion,alternatives:payload.alternatives||[],reviewRequired:payload.review_required===true,text,createdAt:new Date().toISOString(),httpStatus:response.status,latencyMs:elapsed};
        window.lastPrediction=item;historyItems=[item,...historyItems.filter(row=>row.requestId!==item.requestId)].slice(0,100);historyStore.write(historyItems);
        apiReady=true;$("#loadingState").style.display="none";$("#resultContent").innerHTML=renderPrediction(item);$("#resultContent").classList.add("visible");$("#predictButton").disabled=false;await loadMetrics(false);
      }catch(error){
        if(error instanceof TypeError)apiReady=false;
        lastError=error instanceof TypeError?"The prediction API is unavailable. Check that the local server is running, then retry.":error.message;
        $("#loadingState").style.display="none";$("#predictButton").disabled=false;$("#errorPlaceholder")?.remove();const errorNode=document.createElement("div");errorNode.id="errorPlaceholder";errorNode.className="error-box";errorNode.innerHTML=`<strong>Unable to analyze ticket</strong><br>${esc(lastError)}<br><button id="retryButton">Retry</button>`;$("#resultContent").insertAdjacentElement("afterend",errorNode);$("#retryButton").addEventListener("click",submitPrediction);updateApiBadge();
      }
    }
    async function loadMetrics(shouldRender=true){
      try{
        const [readyResponse,metricsResponse,reviewResponse,opsResponse]=await Promise.all([fetch("/ready",{cache:"no-store"}),fetch("/metrics",{cache:"no-store"}),fetch("/tickets/summary",{cache:"no-store"}),fetch("/tickets/operations",{cache:"no-store"})]);
        const readyPayload=await readyResponse.json(),metricsPayload=await metricsResponse.json(),reviewPayload=await reviewResponse.json(),opsPayload=await opsResponse.json();
        apiReady=readyResponse.ok&&readyPayload.status==="ready";apiMetrics=metricsResponse.ok?metricsPayload:null;persistedReviewCount=reviewResponse.ok?reviewPayload.awaiting_review:null;operationsSummary=reviewResponse.ok?reviewPayload:null;departmentCounts=opsResponse.ok?opsPayload.departments||[]:[];
      }catch(_){apiReady=false;apiMetrics=null;persistedReviewCount=null;operationsSummary=null;departmentCounts=[]}
      updateApiBadge();if(shouldRender)render();
    }
    function updateApiBadge(){const dot=$("#apiDot"),state=$("#apiState");dot.classList.toggle("online",apiReady);dot.classList.toggle("offline",!apiReady);state.textContent=apiReady?"API connected":"API unavailable";}
    document.querySelectorAll(".nav button").forEach(button=>button.addEventListener("click",()=>navigate(button.dataset.page)));
    $("#refreshButton").addEventListener("click",()=>loadMetrics());
    $("#menuButton").addEventListener("click",()=>{$("#sidebar").classList.toggle("open");$("#mobileScrim").classList.toggle("open")});
    $("#mobileScrim").addEventListener("click",()=>{$("#sidebar").classList.remove("open");$("#mobileScrim").classList.remove("open")});
    $("#drawerScrim").addEventListener("click",closeDrawer);
    document.addEventListener("keydown",event=>{if(event.key==="Escape"){closeDrawer();$("#sidebar").classList.remove("open");$("#mobileScrim").classList.remove("open")}});
    render();loadMetrics();setInterval(()=>loadMetrics(false),15000);
  </script>
</body>
</html>
